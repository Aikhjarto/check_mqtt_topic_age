# Options for mqtt_message_timestamp_logger.service, see
# mqtt_message_timestamp_logger --help. Without options, the logger
# subscribes to all topics (#) on the broker at localhost:1883.
#
# Keep the password out of this file: put it into
# /etc/mqtt_message_timestamp_logger.password, readable only by root and the
# group mqtt-timestamp-logger, and pass --mqtt-password-file.
#
# Example:
# LOGGER_OPTIONS="--mqtt-broker mqtt.example.org --tls --mqtt-username monitor --mqtt-password-file /etc/mqtt_message_timestamp_logger.password --mqtt-topic sensors/# --mqtt-topic home/+/state"
LOGGER_OPTIONS=""
